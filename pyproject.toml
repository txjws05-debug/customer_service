[project]
name = "customer-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cryptography>=46.0.7",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.14",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 本项目是 uv 虚拟工程（uv.lock 里 source = { virtual = "." }），自身不会被安装进
# 环境，因此 ws 只能从源码树导入。而 `pytest` 这个 console script 不会像
# `python -m pytest` 那样把当前工作目录塞进 sys.path（它只把 tests/ 目录塞进去），
# 所以在 CI 里 `uv run pytest` 会直接报 ModuleNotFoundError: No module named 'ws'。
# 显式声明仓库根目录，保证无论用哪种方式启动 pytest 都能导入 ws。
pythonpath = ["."]
