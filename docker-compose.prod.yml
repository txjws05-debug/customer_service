# ============================================================
# 生产编排：只使用 GHCR 上 CI 构建好的镜像，不在服务器上构建。
#
# 与 docker-compose.yml 的分工：
#   docker-compose.yml              -> 本地开发（含 build:，可在本机构建）
#   docker-compose.prod.yml         -> 服务器生产（只有 image:，纯拉取）
#
# 服务器 1.75G 内存，本地构建 Next.js 极易 OOM，因此生产一律走镜像拉取。
#
# 用法：
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-customer_service}
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs} -d ${POSTGRES_DB:-customer_service}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]

  ecommerce:
    image: ${REGISTRY:-ghcr.io}/txjws05-debug/customer-service-ecommerce:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: cs-ecommerce
    restart: unless-stopped
    env_file:
      - ./deploy/ecommerce.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "18081"
      SEED_ON_STARTUP: "true"
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18081/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    networks: [backend]

  backend:
    image: ${REGISTRY:-ghcr.io}/txjws05-debug/customer-service-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: cs-backend
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    environment:
      COMMERCE_API_BASE_URL: http://ecommerce:18081
      APP_HOST: 0.0.0.0
      APP_PORT: "18082"
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      ecommerce:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18082/docs',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    networks: [backend]

  frontend:
    image: ${REGISTRY:-ghcr.io}/txjws05-debug/customer-service-web:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: cs-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE: ""
      TZ: Asia/Shanghai
    depends_on:
      backend:
        condition: service_started
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    container_name: cs-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - frontend
      - backend
    networks: [backend]

volumes:
  pgdata:
  caddydata:
  caddyconfig:

networks:
  backend:
    driver: bridge
