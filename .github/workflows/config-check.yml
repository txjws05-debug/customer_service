name: config-check

# 只做一件事：检查配置类 Secret 对本次 run 是否可见、形态是否正常。
# 手动触发、约 10 秒跑完 —— 不构建镜像、不连服务器，专门用来快速定位
# 「Secret 到底有没有送到 CI」这类问题（之前排查要跑整条流水线，太慢）。
#
# 日志里只会出现「未配置 / 含非 ASCII / 含空白 / 长度 N」，不会输出任何密钥值。
# 形态有问题时本次检查会变红，并给出该怎么改。
on:
  workflow_dispatch:

jobs:
  check-secrets:
    name: 检查配置类 Secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 可见性
        # Secret 的值在 job 启动那一刻就固定了：如果是启动之后才更新的，
        # 这一次仍然用不到，需要重新触发。
        env:
          HAS_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL != '' }}
          HAS_MODEL: ${{ secrets.EMBEDDING_MODEL != '' }}
          HAS_API_KEY: ${{ secrets.EMBEDDING_API_KEY != '' }}
        run: |
          echo "EMBEDDING_BASE_URL 对本次 run 可见: ${HAS_BASE_URL}"
          echo "EMBEDDING_MODEL    对本次 run 可见: ${HAS_MODEL}"
          echo "EMBEDDING_API_KEY  对本次 run 可见: ${HAS_API_KEY}"
          echo

      - name: 形态（与部署前的校验是同一份脚本）
        env:
          EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
        run: |
          bash deploy/check-secrets.sh
          echo
          echo "判据说明（只看「必然错」的形态，不猜长度）："
          echo "  未配置/为空    = 本次 run 拿不到这个 Secret（GitHub 允许保存空值）"
          echo "  含非 ASCII     = 多半填的是配置文档里的中文占位符"
          echo "  含空白/换行    = 多半把整行配置或命令一起粘了进来"
          echo "  长度不作判据   = 各家 key 长度不固定（百炼的就可能是 117 个字符）；"
          echo "                   想验证 key 是否可用，用 curl 看返回码，那才是事实。"
