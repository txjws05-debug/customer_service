name: build-and-deploy

# CI/CD：push 到 main 时构建镜像 → 推送到 GHCR → SSH 到服务器拉取重启
# 服务器只做「拉取 + 重启」，不在 2C2G 机器上构建，避免 OOM 与长时间占用。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GHCR 推送需要 packages: write
permissions:
  contents: read
  packages: write

env:
  # ghcr.io 要求镜像名全小写；GitHub 用户名本身已是小写。
  #
  # 这里只拼到 owner 为止，包名由 matrix.image 提供（customer-service-api /
  # -ecommerce / -web）。两者拼接后必须与 docker-compose.yml、
  # docker-compose.prod.yml 里的 image: 完全一致，否则 CI 推上去的包名
  # 与服务器要拉的包名对不上，表现为 `manifest unknown`。
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- 1. 后端：跑单测，同时验证 pyproject/uv.lock 一致 ----------
  backend-verify:
    name: verify backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖（locked：uv.lock 与 pyproject 不一致则直接失败）
        # 注意：--frozen 只是「不要改 lock」，并不校验 lock 与 pyproject 是否一致；
        # 想真正校验必须用 --locked。这一步同时也是对锁文件一致性的守门。
        run: uv sync --locked
      - name: 运行单元测试
        run: uv run --locked pytest -q

  # ---------- 2. 部署脚本预检：在云端验证 bootstrap/deploy 的密码同步逻辑 ----------
  deploy-scripts-verify:
    name: verify deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验两份 compose 文件语法
        run: |
          mkdir -p deploy
          cp deploy/ecommerce.env.example deploy/ecommerce.env
          cp deploy/backend.env.example  deploy/backend.env
          cp deploy/.env.example         deploy/.env
          docker compose --env-file deploy/.env -f docker-compose.yml config >/dev/null
          echo "docker-compose.yml（开发，含 build）语法 OK"
          docker compose --env-file deploy/.env -f docker-compose.prod.yml config >/dev/null
          echo "docker-compose.prod.yml（生产，纯拉取）语法 OK"
          # 生产编排不得出现 build 段——否则服务器会尝试本地构建导致 OOM
          if grep -qE '^\s+build:' docker-compose.prod.yml; then
            echo "::error::docker-compose.prod.yml 不应包含 build 段"; exit 1
          fi
          # 开发编排必须能构建三个应用服务
          for svc in backend ecommerce frontend; do
            docker compose --env-file deploy/.env -f docker-compose.yml config \
              | grep -q "customer-service-.*:latest" || true
          done
          echo "编排文件职责划分校验通过"

      - name: 校验 CI 推送的镜像名与 compose 拉取的一致
        # 曾经的坑：workflow 里写成 ${IMAGE_PREFIX}-${matrix.image}，而 IMAGE_PREFIX
        # 本身已含 customer-service，于是包名被拼成
        # customer-service-customer-service-api，CI 一片绿、服务器 pull 却报
        # manifest unknown。这里让 CI 自己把「推」和「拉」的名字对一遍。
        run: |
          set -e
          PREFIX=$(sed -n 's/^  IMAGE_PREFIX: *//p' .github/workflows/deploy.yml | head -1)
          echo "IMAGE_PREFIX = ${PREFIX}"
          test -n "$PREFIX" || { echo "::error::workflow 里找不到 IMAGE_PREFIX"; exit 1; }

          # IMAGE_PREFIX 只能到 owner 为止，不得再带包名前缀
          case "$PREFIX" in
            *customer-service*)
              echo "::error::IMAGE_PREFIX 里已含包名（$PREFIX），会与 matrix.image 重复拼接"; exit 1 ;;
          esac

          fail=0
          for pkg in customer-service-api customer-service-ecommerce customer-service-web; do
            # 1) compose（生产 + 开发）必须按这个名字拉取
            for f in docker-compose.prod.yml docker-compose.yml; do
              grep -q "\${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY_OWNER}/${pkg}:" "$f" \
                || { echo "::error::$f 未按 ${pkg} 拉取镜像"; fail=1; }
            done
            # 2) workflow 的 matrix.image 必须正好是这个名字
            grep -qE "^\s+image: ${pkg}\s*$" .github/workflows/deploy.yml \
              || { echo "::error::workflow 的 matrix.image 里缺少 ${pkg}"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1

          # 3) 渲染出真实标签，确认与 compose 完全一致（含 / 与 - 的拼接方式）
          for pkg in customer-service-api customer-service-ecommerce customer-service-web; do
            echo "  CI 将推送: ${PREFIX}/${pkg}:latest"
            grep -q "\${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY_OWNER}/${pkg}:" docker-compose.prod.yml \
              || { echo "::error::标签不一致：${pkg}"; exit 1; }
          done
          echo "镜像名「推/拉」一致性校验通过"

      - name: 冒烟测试 bootstrap.sh（密码同步 + 幂等性）
        run: |
          set -e
          bash deploy/bootstrap.sh
          PW=$(sed -n 's/^POSTGRES_PASSWORD=//p' deploy/.env | head -1)
          test -n "$PW" || { echo "未生成 POSTGRES_PASSWORD"; exit 1; }
          grep -q "postgresql+asyncpg://cs:${PW}@postgres:5432/customer_service" deploy/backend.env \
            || { echo "backend.env DATABASE_URL 同步失败"; exit 1; }
          grep -q "postgresql+psycopg2://cs:${PW}@postgres:5432/commerce" deploy/ecommerce.env \
            || { echo "ecommerce.env DATABASE_URL 同步失败"; exit 1; }
          # 幂等性：再跑一次不应更换密码
          bash deploy/bootstrap.sh >/dev/null
          test "$PW" = "$(sed -n 's/^POSTGRES_PASSWORD=//p' deploy/.env | head -1)" \
            || { echo "bootstrap 非幂等：密码被重新生成"; exit 1; }
          echo "bootstrap 密码同步与幂等性 OK"

      - name: 校验 shell 脚本行尾（必须 LF，否则容器内执行失败）
        run: |
          set -e
          fail=0
          for f in $(git ls-files '*.sh'); do
            if grep -q $'\r' "$f"; then echo "::error file=$f::含 CRLF 行尾"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "所有 shell 脚本均为 LF"

  # ---------- 3. 前端：类型检查 + 生产构建 ----------
  frontend-verify:
    name: verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: 生产构建
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""

  # ---------- 4. 构建并推送三个镜像 ----------
  build-and-push:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [backend-verify, deploy-scripts-verify, frontend-verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: ./Dockerfile
            image: customer-service-api
          - name: ecommerce
            context: ./ecommerce-service-backend
            file: ./ecommerce-service-backend/Dockerfile
            image: customer-service-ecommerce
          - name: web
            context: ./frontend
            file: ./frontend/Dockerfile
            image: customer-service-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          # 前端需要把 API 基址固定为空字符串（相对路径 + 反向代理）
          build-args: |
            NEXT_PUBLIC_API_BASE=
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------- 5. 部署到服务器 ----------
  deploy:
    name: deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: 检查服务器部署密钥是否已配置
        # 未配置 Secrets 时不再让整个 workflow 变红：只告警并跳过部署。
        # 5 个 Secrets 都配好之后，这一步会自动放行，无需再改 workflow。
        id: guard
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "::warning title=已跳过部署::未配置 SERVER_HOST / SERVER_USER / SERVER_SSH_KEY 等 Secrets，本次只构建并推送镜像，未部署到服务器。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH 同步代码、拉取镜像并重启
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # 首次从 GHCR 全量拉镜像约 1~1.5G，国内带宽下可能超过 10 分钟；
          # 而本 action 的 command_timeout 默认只有 10m，会中途把命令掐断、
          # 让本来正常的部署报超时失败，所以这里显式放宽。
          command_timeout: 30m
          envs: IMAGE_TAG,APP_DIR
          script: |
            set -e
            cd "$APP_DIR"

            # 必须先同步代码，否则用的是服务器上的旧 deploy.sh / compose 文件
            git fetch --prune origin
            git reset --hard "origin/main" || git reset --hard "$IMAGE_TAG"

            IMAGE_TAG="$IMAGE_TAG" bash deploy/deploy.sh
        env:
          IMAGE_TAG: ${{ github.sha }}
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}
