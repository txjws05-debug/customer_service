name: build-and-deploy

# CI/CD：push 到 main 时构建镜像 → 推送到 GHCR → SSH 到服务器拉取重启
# 服务器只做「拉取 + 重启」，不在 2C2G 机器上构建，避免 OOM 与长时间占用。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GHCR 推送需要 packages: write
permissions:
  contents: read
  packages: write

env:
  # ghcr.io 要求镜像名全小写；GitHub 用户名本身已是小写。
  #
  # 这里只拼到 owner 为止，包名由 matrix.image 提供（customer-service-api /
  # -ecommerce / -web）。两者拼接后必须与 docker-compose.yml、
  # docker-compose.prod.yml 里的 image: 完全一致，否则 CI 推上去的包名
  # 与服务器要拉的包名对不上，表现为 `manifest unknown`。
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- 0. 判断这次改了什么：决定重建哪些镜像 ----------
  # 一次 push 只改前端时，没必要连后端和中台镜像一起构建 —— 那要多花几分钟
  # 构建、还要多拉几百 MB。判定逻辑放在 deploy/detect-changes.sh 里（可单测）。
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      images_csv: ${{ steps.diff.outputs.images_csv }}
      deploy_needed: ${{ steps.diff.outputs.deploy_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要能 diff 到上一次推送的那个提交，浅克隆做不到
          fetch-depth: 0

      - id: diff
        name: 对比本次推送涉及的文件
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] \
             || [ -z "$before" ] \
             || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            # 手动触发 / 新分支首次推送：没有可比对的基线，按「全都可能改过」处理
            echo "没有可比对的基线，按全量处理"
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "$before" "${{ github.sha }}")"
          fi

          echo "本次涉及 $(printf '%s\n' "$files" | grep -c . || true) 个文件，前 20 个："
          printf '%s\n' "$files" | grep . | head -20 | sed 's/^/  /'

          detected="$(printf '%s\n' "$files" | bash deploy/detect-changes.sh)"
          echo "$detected"
          printf '%s\n' "$detected" >> "$GITHUB_OUTPUT"

  # ---------- 1. 后端：跑单测，同时验证 pyproject/uv.lock 一致 ----------
  backend-verify:
    name: verify backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖（locked：uv.lock 与 pyproject 不一致则直接失败）
        # 注意：--frozen 只是「不要改 lock」，并不校验 lock 与 pyproject 是否一致；
        # 想真正校验必须用 --locked。这一步同时也是对锁文件一致性的守门。
        run: uv sync --locked
      - name: 运行单元测试
        run: uv run --locked pytest -q

  # ---------- 1b. 电商中台：单测 + 交易链路集成测试 ----------
  ecommerce-verify:
    name: verify ecommerce
    runs-on: ubuntu-latest
    # 交易链路必须跑在真实 PostgreSQL 上：库存行锁（SELECT ... FOR UPDATE）、
    # Numeric 金额、JSON 列在 SQLite 上验证不了
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U cs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ecommerce-service-backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖（locked：uv.lock 与 pyproject 不一致则直接失败）
        run: uv sync --locked
      - name: 运行单元测试与集成测试
        env:
          TEST_ADMIN_DATABASE_URL: postgresql+psycopg2://cs:test@127.0.0.1:55433/postgres
        run: |
          set -o pipefail
          uv run --locked pytest -q -rs | tee /tmp/pytest.log
          # 集成测试依赖 services.postgres：出现 skip 说明库没连上，
          # 那样「交易链路通过」就是假的，必须让 CI 红
          if grep -qE '[0-9]+ skipped' /tmp/pytest.log; then
            echo "::error::有测试被跳过——交易链路集成测试必须在真实 PostgreSQL 上运行"
            exit 1
          fi

  # ---------- 2. 部署脚本预检：在云端验证 bootstrap/deploy 的密码同步逻辑 ----------
  deploy-scripts-verify:
    name: verify deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验两份 compose 文件语法
        run: |
          mkdir -p deploy
          cp deploy/ecommerce.env.example deploy/ecommerce.env
          cp deploy/backend.env.example  deploy/backend.env
          cp deploy/.env.example         deploy/.env
          docker compose --env-file deploy/.env -f docker-compose.yml config >/dev/null
          echo "docker-compose.yml（开发，含 build）语法 OK"
          docker compose --env-file deploy/.env -f docker-compose.prod.yml config >/dev/null
          echo "docker-compose.prod.yml（生产，纯拉取）语法 OK"
          # 生产编排不得出现 build 段——否则服务器会尝试本地构建导致 OOM
          if grep -qE '^\s+build:' docker-compose.prod.yml; then
            echo "::error::docker-compose.prod.yml 不应包含 build 段"; exit 1
          fi
          # 开发编排必须能构建三个应用服务
          for svc in backend ecommerce frontend; do
            docker compose --env-file deploy/.env -f docker-compose.yml config \
              | grep -q "customer-service-.*:latest" || true
          done
          echo "编排文件职责划分校验通过"

      - name: 校验 Caddyfile 语法
        # Caddyfile 写错要到线上 reload 才暴露（而且是部署后才 404，排查成本高）。
        # 这里用官方镜像先校验一遍；{$SITE_ADDRESS} 需要给个值，否则占位符为空。
        run: |
          docker run --rm -e SITE_ADDRESS=:80 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "Caddyfile 语法校验通过"

      - name: 校验 CI 推送的镜像名与 compose 拉取的一致
        # 曾经的坑：workflow 里写成 ${IMAGE_PREFIX}-${matrix.image}，而 IMAGE_PREFIX
        # 本身已含 customer-service，于是包名被拼成
        # customer-service-customer-service-api，CI 一片绿、服务器 pull 却报
        # manifest unknown。这里让 CI 自己把「推」和「拉」的名字对一遍。
        run: |
          set -e
          PREFIX=$(sed -n 's/^  IMAGE_PREFIX: *//p' .github/workflows/deploy.yml | head -1)
          echo "IMAGE_PREFIX = ${PREFIX}"
          test -n "$PREFIX" || { echo "::error::workflow 里找不到 IMAGE_PREFIX"; exit 1; }

          # IMAGE_PREFIX 只能到 owner 为止，不得再带包名前缀
          case "$PREFIX" in
            *customer-service*)
              echo "::error::IMAGE_PREFIX 里已含包名（$PREFIX），会与 matrix.image 重复拼接"; exit 1 ;;
          esac

          fail=0
          for pkg in customer-service-api customer-service-ecommerce customer-service-web; do
            # 1) compose（生产 + 开发）必须按这个名字拉取
            for f in docker-compose.prod.yml docker-compose.yml; do
              grep -q "\${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY_OWNER}/${pkg}:" "$f" \
                || { echo "::error::$f 未按 ${pkg} 拉取镜像"; fail=1; }
            done
            # 2) workflow 的 matrix.image 必须正好是这个名字
            grep -qE "^\s+image: ${pkg}\s*$" .github/workflows/deploy.yml \
              || { echo "::error::workflow 的 matrix.image 里缺少 ${pkg}"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1

          # 3) 渲染出真实标签，确认与 compose 完全一致（含 / 与 - 的拼接方式）
          for pkg in customer-service-api customer-service-ecommerce customer-service-web; do
            echo "  CI 将推送: ${PREFIX}/${pkg}:latest"
            grep -q "\${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY_OWNER}/${pkg}:" docker-compose.prod.yml \
              || { echo "::error::标签不一致：${pkg}"; exit 1; }
          done
          echo "镜像名「推/拉」一致性校验通过"

      - name: 冒烟测试 bootstrap.sh（密码同步 + 幂等性）
        run: |
          set -e
          bash deploy/bootstrap.sh
          PW=$(sed -n 's/^POSTGRES_PASSWORD=//p' deploy/.env | head -1)
          test -n "$PW" || { echo "未生成 POSTGRES_PASSWORD"; exit 1; }
          grep -q "postgresql+asyncpg://cs:${PW}@postgres:5432/customer_service" deploy/backend.env \
            || { echo "backend.env DATABASE_URL 同步失败"; exit 1; }
          grep -q "postgresql+psycopg2://cs:${PW}@postgres:5432/commerce" deploy/ecommerce.env \
            || { echo "ecommerce.env DATABASE_URL 同步失败"; exit 1; }
          # 幂等性：再跑一次不应更换密码
          bash deploy/bootstrap.sh >/dev/null
          test "$PW" = "$(sed -n 's/^POSTGRES_PASSWORD=//p' deploy/.env | head -1)" \
            || { echo "bootstrap 非幂等：密码被重新生成"; exit 1; }
          echo "bootstrap 密码同步与幂等性 OK"

      - name: 校验 shell 脚本语法与行尾
        run: |
          set -e
          # 语法：deploy 时会直接在服务器上执行，写错一个符号就整条流水线部署失败
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::shell 语法错误"; exit 1; }
          done
          echo "所有 shell 脚本语法 OK"
          # 行尾必须是 LF，否则容器内执行失败
          fail=0
          for f in $(git ls-files '*.sh'); do
            if grep -q $'\r' "$f"; then echo "::error file=$f::含 CRLF 行尾"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "所有 shell 脚本均为 LF"

      - name: 校验部署脚本语义（配置下发 / 配置校验 / 改动检测）
        # 断言本体在 tests/ 下，本地与 CI 跑同一份，避免两边漂移。
        run: |
          bash tests/test_apply_secrets.sh
          bash tests/test_check_secrets.sh
          bash tests/test_detect_changes.sh

  # ---------- 3. 前端：类型检查 + 生产构建 ----------
  frontend-verify:
    name: verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: 生产构建
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""

  # ---------- 4. 构建并推送三个镜像（只重建改动过的） ----------
  build-and-push:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [changes, backend-verify, deploy-scripts-verify, frontend-verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: ./Dockerfile
            image: customer-service-api
          - name: ecommerce
            context: ./ecommerce-service-backend
            file: ./ecommerce-service-backend/Dockerfile
            image: customer-service-ecommerce
          - name: web
            context: ./frontend
            file: ./frontend/Dockerfile
            image: customer-service-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 复用上次构建的镜像（本组件未改动）
        # 只写 manifest、不传层数据：秒级完成，而且服务器拉这个 tag 时
        # 每一层都命中本地缓存，等于「零下载」。
        # 这样 IMAGE_TAG 仍然是本次 commit，回滚/排查的语义不变。
        if: ${{ !contains(needs.changes.outputs.images_csv, format(',{0},', matrix.name)) }}
        run: |
          set -e
          SRC="${IMAGE_PREFIX}/${{ matrix.image }}:latest"
          TGT="${IMAGE_PREFIX}/${{ matrix.image }}:${{ github.sha }}"
          echo "本次未改动 ${{ matrix.name }}，复用 $SRC → $TGT"
          docker buildx imagetools create -t "$TGT" "$SRC"

      - name: 构建并推送（本组件有改动）
        if: ${{ contains(needs.changes.outputs.images_csv, format(',{0},', matrix.name)) }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          # 前端需要把 API 基址固定为空字符串（相对路径 + 反向代理）
          build-args: |
            NEXT_PUBLIC_API_BASE=
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------- 5. 部署到服务器 ----------
  deploy:
    name: deploy to server
    runs-on: ubuntu-latest
    needs: [changes, build-and-push]
    # 只改了文档之类的东西时不必部署（未改动的镜像走的是复用，所以
    # build-and-push 一定会跑完，不会因为被跳过而连累这一步）
    if: needs.changes.outputs.deploy_needed == 'true'
    environment: production
    steps:
      # deploy job 只在服务器上通过 SSH 操作，本来不需要本地代码；
      # 但「预先校验配置形态」那一步要跑仓库里的 deploy/check-secrets.sh，
      # 没有 checkout 就会 No such file or directory（exit 127）——线上真踩过。
      # tests/test_workflows.py 里有断言盯着这件事。
      - uses: actions/checkout@v4

      - name: 检查服务器部署密钥是否已配置
        # 未配置 Secrets 时不再让整个 workflow 变红：只告警并跳过部署。
        # 5 个 Secrets 都配好之后，这一步会自动放行，无需再改 workflow。
        id: guard
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "::warning title=已跳过部署::未配置 SERVER_HOST / SERVER_USER / SERVER_SSH_KEY 等 Secrets，本次只构建并推送镜像，未部署到服务器。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查配置类 Secret 是否对本次 run 可见
        # Secret 的值在 job 启动那一刻就固定了：如果是在 run 启动之后才更新的
        # Secret，这一次仍然用不到。把「可见性」直接打在日志里，省得靠推理。
        # 注意这里只输出 true/false，不输出任何值。
        env:
          HAS_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL != '' }}
          HAS_MODEL: ${{ secrets.EMBEDDING_MODEL != '' }}
          HAS_API_KEY: ${{ secrets.EMBEDDING_API_KEY != '' }}
        run: |
          echo "EMBEDDING_BASE_URL 对本次 run 可见: ${HAS_BASE_URL}"
          echo "EMBEDDING_MODEL    对本次 run 可见: ${HAS_MODEL}"
          echo "EMBEDDING_API_KEY  对本次 run 可见: ${HAS_API_KEY}"
          if [ "${HAS_API_KEY}" != "true" ]; then
            echo "::warning title=embedding 配置读不到::本次 run 取不到 EMBEDDING_API_KEY —— 要么 Secret 没配好，要么它是在本次 run 启动之后才更新的（重新触发一次即可）。"
          fi

      - name: 预先校验配置形态（填错就不必等构建和拉镜像）
        # 放在 SSH 之前：配置明显填错时 10 秒内失败，并直接说清该怎么改。
        env:
          EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
        run: bash deploy/check-secrets.sh

      - name: SSH 同步代码、拉取镜像并重启
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # 首次从 GHCR 全量拉镜像约 1~1.5G，国内带宽下可能超过 10 分钟；
          # 而本 action 的 command_timeout 默认只有 10m，会中途把命令掐断、
          # 让本来正常的部署报超时失败，所以这里显式放宽。
          command_timeout: 30m
          # 后面这几个是「配置下发」用的：值来自 GitHub Secrets，
          # 由 deploy/apply-secrets.sh 写进服务器上的 deploy/backend.env。
          # 没配的 Secret 传进来是空串，脚本会跳过，不会动服务器上的已有值。
          envs: IMAGE_TAG,APP_DIR,EMBEDDING_BASE_URL,EMBEDDING_MODEL,EMBEDDING_API_KEY,EMBEDDING_DIM
          script: |
            set -e
            cd "$APP_DIR"

            # 必须先同步代码，否则用的是服务器上的旧 deploy.sh / compose 文件
            git fetch --prune origin
            git reset --hard "origin/main" || git reset --hard "$IMAGE_TAG"

            # 把 GitHub Secrets 里的配置落到服务器 env 文件上。
            # 这样「改密钥 / 换 embedding 模型」也只改 Secret 重跑流水线即可，
            # 不需要登录服务器手改文件。
            bash deploy/apply-secrets.sh

            IMAGE_TAG="$IMAGE_TAG" bash deploy/deploy.sh

            # 只改了配置、镜像 tag 没变时，compose 未必会重建容器；
            # apply-secrets.sh 检测到变化会留下标记，这里补一次（只重建 backend）。
            if [ -f /tmp/cs-env-changed ]; then
              rm -f /tmp/cs-env-changed
              echo "==> 配置有变化，重建 backend 容器"
              docker compose -f docker-compose.prod.yml --env-file deploy/.env \
                up -d --force-recreate backend
            fi

            # 部署后自检：确认服务真的能用当前配置的 embedding 后端。
            # 配置写错（例如 key 还是文档里的占位符）会让这一步失败，
            # 于是直接在 Actions 日志里就能看到原因，不必登服务器翻容器日志。
            echo "==> 部署后自检：embedding 后端"
            docker exec cs-backend python -m ws.knowledge.reindex --probe
        env:
          IMAGE_TAG: ${{ github.sha }}
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          # 可选：配了就自动下发到服务器；没配则服务器保持原样
          EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_DIM: ${{ secrets.EMBEDDING_DIM }}
